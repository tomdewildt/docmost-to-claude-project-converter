[project]
name = "docmost-to-claude-project-converter"
version = "0.1.0"
description = "Convert Docmost pages to Claude project knowledge"
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.28.0",
    "loguru>=0.7.3",
    "patchright>=1.64.4",
    "pydantic-settings>=2.8.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmost_to_claude_project_converter"]

[tool.pytest.ini_options]
markers = ["integration: hits the local Docmost instance or a local browser (requires docker and patchright)"]
addopts = "-m 'not integration'"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
